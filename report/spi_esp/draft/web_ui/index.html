<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPI Logic Analyzer & Controller</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Main Header -->
        <header>
            <h1>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #00f0ff;"><polygon points="6 2 18 2 18 6 6 6 6 2"></polygon><rect x="3" y="6" width="18" height="16" rx="2"></rect><line x1="10" y1="12" x2="14" y2="12"></line></svg>
                SPI Core Analyzer
            </h1>
            
            <!-- Target IP Address Configuration -->
            <div class="ip-config-bar">
                <label for="espIp">ESP32 IP:</label>
                <input type="text" id="espIp" value="172.20.10.2" placeholder="e.g. 192.168.1.100">
                <button id="btnConnect" onclick="toggleConnection()">Connect</button>
            </div>

            <div class="status-badge">
                <div id="statusDot" class="status-dot"></div>
                <span id="statusText">DISCONNECTED</span>
            </div>
        </header>

        <!-- Sidebar Manual Control -->
        <div class="card">
            <div class="card-title">Manual Control</div>
            <div class="control-group">
                <div class="control-item">
                    <div class="control-label">
                        <span class="pin-name" style="color: var(--cs-color)">CS</span>
                        <span class="pin-desc">Chip Select (Active LOW)</span>
                    </div>
                    <button id="btnCS" class="btn-toggle" onclick="sendControl('cs')">HIGH (Idle)</button>
                </div>
                <div class="control-item">
                    <div class="control-label">
                        <span class="pin-name" style="color: var(--rst-color)">RST</span>
                        <span class="pin-desc">FPGA Reset (Active HIGH)</span>
                    </div>
                    <button id="btnRST" class="btn-toggle" onclick="sendControl('rst')">LOW (Run)</button>
                </div>
                <div class="control-item">
                    <div class="control-label">
                        <span class="pin-name" style="color: var(--mosi-color)">MOSI</span>
                        <span class="pin-desc">Master Out Slave In</span>
                    </div>
                    <button id="btnMOSI" class="btn-toggle" onclick="sendControl('mosi')">LOW (0)</button>
                </div>
            </div>
            
            <div class="card-title" style="margin-top: 1rem;">Live Values</div>
            <div class="status-display-grid">
                <div class="status-display-card" style="border-top: 2px solid var(--cs-color)">
                    <div class="status-display-name">CS</div>
                    <div class="status-display-val" id="valCS" style="color: var(--cs-color)">-</div>
                </div>
                <div class="status-display-card" style="border-top: 2px solid var(--clk-color)">
                    <div class="status-display-name">CLK</div>
                    <div class="status-display-val" id="valCLK" style="color: var(--clk-color)">-</div>
                </div>
                <div class="status-display-card" style="border-top: 2px solid var(--rst-color)">
                    <div class="status-display-name">RST</div>
                    <div class="status-display-val" id="valRST" style="color: var(--rst-color)">-</div>
                </div>
                <div class="status-display-card" style="border-top: 2px solid var(--miso-color)">
                    <div class="status-display-name">MISO</div>
                    <div class="status-display-val" id="valMISO" style="color: var(--miso-color)">-</div>
                </div>
                <div class="status-display-card" style="border-top: 2px solid var(--mosi-color)">
                    <div class="status-display-name">MOSI</div>
                    <div class="status-display-val" id="valMOSI" style="color: var(--mosi-color)">-</div>
                </div>
            </div>
        </div>

        <!-- Analyzer Chart -->
        <div class="canvas-container">
            <canvas id="laCanvas"></canvas>
            <div class="canvas-toolbar">
                <div style="font-size: 0.8rem; color: var(--text-secondary)">CLK: 0.3 Hz (3.3s Period) | Sample: 20Hz (50ms)</div>
                <div style="display: flex; gap: 0.75rem;">
                    <button class="toolbar-btn" onclick="clearBuffer()">
                        Clear Screen
                    </button>
                    <button class="toolbar-btn" id="btnPause" onclick="togglePause()">
                        <span id="pauseTxt">Pause</span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
